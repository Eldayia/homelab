services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: container:gluetun
    environment:
      TZ: ${TZ:-Europe/Paris}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
    volumes:
      - ./config:/config
    security_opt:
      - no-new-privileges:true
