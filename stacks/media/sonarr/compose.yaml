services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: "002"
    volumes:
      - ./config:/config
      - /srv/media/downloads/torrents:/data/torrents
      - /mnt/nas/downloads/usenet:/data/usenet
      - /mnt/nas/downloads/jdownloader:/data/jdownloader
      - /mnt/nas/multimedia:/data/media
    expose:
      - "8989"
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
    name: proxy
