services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Europe/Paris}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}

      # Nécessaire avec le réseau bridge Docker
      FTLCONF_dns_listeningMode: ALL

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${LAN_IP:-192.168.1.240}:${PIHOLE_ADMIN_PORT:-8085}:80"

    networks:
      - proxy

    volumes:
      - ./etc-pihole:/etc/pihole

    cap_add:
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
