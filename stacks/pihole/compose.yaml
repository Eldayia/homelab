services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    environment:
      TZ: Europe/Paris
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}

      # Nécessaire avec le réseau bridge Docker
      FTLCONF_dns_listeningMode: ALL

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "192.168.1.240:8085:80"

    networks:
      - proxy

    volumes:
      - ./etc-pihole:/etc/pihole

    cap_add:
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
