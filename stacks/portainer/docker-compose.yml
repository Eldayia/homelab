name: portainer

services:
  portainer:
    image: portainer/portainer-ce:2.33.6
    container_name: portainer
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "192.168.1.240:9443:9443"

    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
