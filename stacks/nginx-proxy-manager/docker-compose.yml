name: nginx-proxy-manager

services:
  nginx-proxy-manager:
    image: docker.io/jc21/nginx-proxy-manager:2.15.1
    container_name: nginx-proxy-manager
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "192.168.1.240:81:81"

    environment:
      TZ: Europe/Paris

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

    networks:
      - proxy

networks:
  proxy:
    name: proxy
